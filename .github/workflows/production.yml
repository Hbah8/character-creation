name: Production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIRECTORY: /opt/apps/character-creation
  IMAGE_NAME: ${{ vars.GHCR_IMAGE }}
  BACKEND_IMAGE_NAME: ${{ vars.GHCR_IMAGE }}-backend

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: character-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: character-app/package-lock.json
      - run: npm ci
      - run: npm run check

  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn --batch-mode --no-transfer-progress test

  configuration-checks:
    name: Configuration checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Validate YAML syntax
        run: |
          find . \
            -path './.git' -prune -o \
            -path './node_modules' -prune -o \
            -path './character-app/node_modules' -prune -o \
            -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 |
            xargs -0 ruby -r yaml -e 'ARGV.each { |path| YAML.load_file(path); puts "Validated #{path}" }'
      - name: Validate production Compose
        run: |
          runtime_env=$(mktemp)
          trap 'rm -f "$runtime_env" .runtime.env' EXIT
          printf 'POSTGRES_PASSWORD=validation-only\nDATABASE_PASSWORD=validation-only\n' > "$runtime_env"
          cp "$runtime_env" .runtime.env
          IMAGE=example.invalid/character-creation:validation \
          BACKEND_IMAGE=example.invalid/character-creation-backend:validation \
            docker compose config --quiet

  publish:
    name: Build and publish image
    if: github.event_name != 'pull_request'
    needs: [checks, backend-checks, configuration-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.web-image.outputs.reference }}
      backend_image: ${{ steps.backend-image.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: web-image
        run: echo "reference=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.web-image.outputs.reference }}
      - id: backend-image
        run: echo "reference=${BACKEND_IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.backend-image.outputs.reference }}

  deploy:
    name: Deploy to VPS
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://${{ vars.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Stage deployment files
        run: |
          ssh -o BatchMode=yes "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "mkdir -p '${APP_DIRECTORY}/.deploy-staging'"
          scp -o BatchMode=yes \
            compose.yaml \
            deploy/deploy.sh \
            deploy/apply-staged-deploy.sh \
            deploy/nginx-https.conf \
            deploy/issue-certificates.sh \
            deploy/renew-certificates.sh \
            deploy/systemd/character-creation-certbot-renew.service \
            deploy/systemd/character-creation-certbot-renew.timer \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${APP_DIRECTORY}/.deploy-staging/"
      - name: Deploy immutable image
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          BACKEND_IMAGE: ${{ needs.publish.outputs.backend_image }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          DATABASE_PASSWORD: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
        run: |
          test -n "$DATABASE_PASSWORD"
          printf '%s' "$GHCR_PULL_TOKEN" | ssh -o BatchMode=yes "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "docker login ghcr.io --username '${{ github.repository_owner }}' --password-stdin"
          printf '%s' "$DATABASE_PASSWORD" | ssh -o BatchMode=yes "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "umask 077; cat > '${APP_DIRECTORY}/.deploy-staging/database-password'"
          ssh -o BatchMode=yes "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "IMAGE='${IMAGE}' BACKEND_IMAGE='${BACKEND_IMAGE}' APP_DIR='${APP_DIRECTORY}' sh '${APP_DIRECTORY}/.deploy-staging/apply-staged-deploy.sh'; status=\$?; rm -f '${APP_DIRECTORY}/.deploy-staging/database-password'; exit \$status"
