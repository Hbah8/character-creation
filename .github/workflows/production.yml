name: Production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIRECTORY: /opt/apps/character-creation
  IMAGE_NAME: ${{ vars.GHCR_IMAGE }}

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: character-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: character-app/package-lock.json
      - run: npm ci
      - run: npm run check

  publish:
    name: Build and publish image
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "reference=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.reference }}

  deploy:
    name: Deploy to VPS
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: http://${{ vars.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload Compose deployment files
        run: |
          scp -o BatchMode=yes compose.yaml deploy/deploy.sh \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${APP_DIRECTORY}/"
      - name: Deploy immutable image
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          printf '%s' "$GHCR_PULL_TOKEN" | ssh -o BatchMode=yes "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "docker login ghcr.io --username '${{ github.repository_owner }}' --password-stdin && chmod 750 '${APP_DIRECTORY}/deploy.sh' && APP_DIR='${APP_DIRECTORY}' IMAGE='${IMAGE}' '${APP_DIRECTORY}/deploy.sh'"
