server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://13.140.206.57$request_uri;
    }
}

server {
    listen 127.0.0.1:8081;
    server_name localhost;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

include /etc/nginx/https-enabled/*.conf;
