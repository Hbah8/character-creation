name: character-creation-backend-dev

services:
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    labels:
      org.springframework.boot.ignore: "true"
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: character_creation
      POSTGRES_USER: character_creation
      POSTGRES_PASSWORD: character_creation
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U character_creation -d character_creation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
